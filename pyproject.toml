[project]
name = "marker"
version = "0.1.0"
description = "Mark student essays 0-100 against a rubric with a local gpt-oss model via Ollama"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
marker = "marker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["marker"]
